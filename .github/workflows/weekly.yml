name: weekly drift check
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SHADCN_VERSION: latest
      KF_SINK_ALL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C tests exec playwright install --with-deps chromium webkit firefox
      - run: pnpm registry:build
      - run: pnpm fixtures:create && pnpm fixtures:sync && pnpm fixtures:build
      - run: pnpm check:vite && pnpm check:monorepo
      - run: pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-reports
          path: .reports
