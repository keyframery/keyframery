name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C tests exec playwright install --with-deps chromium webkit firefox
      - run: pnpm typecheck && pnpm test:unit
      - run: pnpm registry:build
      - run: pnpm fixtures:sync && pnpm fixtures:build
      - run: pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: .reports
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C tests exec playwright install --with-deps chromium webkit firefox
      - run: pnpm test:unit
      - run: pnpm site:build
      - run: pnpm -C apps/web exec tsc --noEmit && pnpm -C apps/web lint
      - run: pnpm test:site
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-reports
          path: .reports
