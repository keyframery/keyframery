<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Closing frames of a UI SDK dialog styled with shadcn's classes</title>
  <desc id="d">Two rows of frames, one per frame after Escape. Top row, shadcn's classes pasted as they are: the dialog fades from 100 percent to 0, then shows at 100 percent again for one frame before UI SDK removes it. Bottom row, with data-closed:fill-mode-forwards added: the dialog fades to 0 and stays there until it is removed.</desc>
