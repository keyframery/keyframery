<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyframery bench (Vue)</title>
    <script>
      /* ?motion=subtle|calm|springy|snappy|playful and ?theme=dark, set on <html> before first render,
         exactly like the lab (src/App.tsx) and the React bench. Subtle is the default: no attribute. */
      const q = new URLSearchParams(location.search)
      const m = q.get("motion") ?? "subtle"
      if (m !== "subtle") document.documentElement.setAttribute("data-motion", m)
      if (q.get("theme") === "dark") document.documentElement.classList.add("dark")
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
